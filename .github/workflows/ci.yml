# Автоматические проверки. Запускаются сами при каждой отправке изменений
# и при каждом запросе на внесение изменений в основную ветку.
#
# Порядок шагов не случайный: сначала быстрые проверки, потом медленные.
# Нет смысла тратить две минуты на тесты, если код не проходит проверку
# стиля за десять секунд.

name: Проверки

on:
  push:
    branches: [main]
  pull_request:

# Если отправить новое изменение, пока старая проверка ещё идёт,
# старая останавливается: незачем занимать очередь устаревшим кодом.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Стиль кода
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить проверялку стиля
        run: pip install "ruff>=0.8"

      - name: Проверить правила
        run: ruff check .

      - name: Проверить оформление
        run: ruff format --check .

  tests:
    name: Тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости обоих сервисов
        run: |
          pip install --upgrade pip
          pip install -e "./services/accounts[dev]" -e "./services/orders[dev]"

      - name: Прогнать тесты
        run: pytest --cov-report=term-missing

  integration:
    name: Тест связки
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Поставить зависимости обоих сервисов
        run: |
          pip install --upgrade pip
          pip install -e "./services/accounts[dev]" -e "./services/orders[dev]"

      - name: Прогнать интеграционный тест без coverage-порога
        run: pytest services/orders/tests/test_orders_flow.py -p no:cacheprovider --no-cov

  docker:
    name: Сборка образов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать образ сервиса клиентов
        run: docker build -t accounts:ci ./services/accounts

      - name: Собрать образ сервиса заказов
        run: docker build -t orders:ci ./services/orders

      - name: Показать размеры образов
        run: docker images --format "{{.Repository}}:{{.Tag}}  {{.Size}}" | grep ':ci'

  secrets-scan:
    name: Поиск паролей
    runs-on: ubuntu-latest
    env:
      VERSION: 8.21.2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Поставить gitleaks
        run: |
          URL=https://github.com/gitleaks/gitleaks/releases/download
          curl -sSL "$URL/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
      - name: Искать пароли во всей истории
        run: ./gitleaks git . --redact

  publish:
    name: Публикация образа
    needs: [lint, tests, integration, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Собрать и отправить образ
        run: |
          # Принудительно переводим имя репозитория в нижний регистр
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          IMAGE=ghcr.io/$REPO_LOWER/orders
          SRC=${{ github.server_url }}/$REPO_LOWER
          
          docker build -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.source=$SRC services/orders
          docker push "$IMAGE:${{ github.sha }}"