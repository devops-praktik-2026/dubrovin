---
- name: Настроить сервер под приложение
  hosts: app
  become: true
  vars:
    app_version: "0.1.0"
    app_root: /opt/orders
    wheel_name: "orders-{{ app_version }}-py3-none-any.whl"
    # playbook_dir = infra/ansible → ../../ = корень репозитория
    wheel_src: "{{ playbook_dir }}/../../dist/{{ wheel_name }}"
    accounts_url: http://127.0.0.1:8001
    partner_public_keys: []
  pre_tasks:
    - name: Запретить --check для этого сценария
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: "Используй --syntax-check; --check не поддерживается."
    - name: Проверить формат версии
      ansible.builtin.assert:
        that: app_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
  roles:
    - base
    - app
