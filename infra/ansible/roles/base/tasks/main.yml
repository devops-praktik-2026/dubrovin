---
- name: Установить системные зависимости
  ansible.builtin.apt:
    name: [python3, python3-pip, python3-venv, supervisor, ca-certificates]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Создать каталоги приложения
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: deploy
    group: deploy
    mode: "0755"
  loop:
    - "{{ app_root }}"
    - "{{ app_root }}/packages"

- name: Добавить открытые ключи участников
  ansible.posix.authorized_key:
    user: deploy
    key: "{{ item }}"
    state: present
    exclusive: false
  loop: "{{ partner_public_keys }}"
